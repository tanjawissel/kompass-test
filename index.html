  --terra-deep: #A85B3C;
  --olive: #6B7C4A;
  --bark: #2E2419;
  --ink: #2C2418;
  --ink-muted: #766351;
  --line: #E1D4BC;
  --surface: #FFFFFF;
  --shadow: 0 1px 2px rgba(59,44,26,.06), 0 6px 18px rgba(59,44,26,.07);
  --radius: 14px;
  --serif: 'Cormorant Garamond', Georgia, serif;
  --sans: 'Lato', system-ui, -apple-system, 'Segoe UI', sans-serif;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--creme);
  color: var(--ink);
  font: 400 17px/1.6 var(--sans);
}

/* Kopf */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding-block: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--bark); color: var(--sand); gap: 12px;
}
.brand { font-family: var(--serif); font-size: 1.15rem; letter-spacing: .14em; font-weight: 600; }
.brand span { letter-spacing: .02em; font-weight: 400; color: var(--gold-soft); }
.proto-badge {
  font-size: .72rem; text-transform: uppercase; letter-spacing: .12em;
  border: 1px solid rgba(232,192,122,.5); color: var(--gold-soft);
  padding: 3px 9px; border-radius: 99px;
}
.progress { height: 4px; background: var(--sand-deep); }
.progress-bar { height: 100%; width: 0; background: var(--gold); transition: width .35s ease; }

.wrap { max-width: 640px; margin: 0 auto; padding-block: 28px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.foot { max-width: 640px; margin: 0 auto; padding-block: 0 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); font-size: .82rem; color: var(--ink-muted); text-align: center; }

/* Typografie */
h1, h2, h3 { font-family: var(--serif); font-weight: 600; line-height: 1.15; margin: 0 0 .5em; color: var(--bark); text-wrap: balance; }
h1 { font-size: clamp(2rem, 6vw, 2.6rem); }
h2 { font-size: 1.6rem; }
h3 { font-size: 1.3rem; margin-top: 1.4em; }
p { margin: 0 0 .9em; }
.eyebrow { font-size: .78rem; text-transform: uppercase; letter-spacing: .14em; color: var(--terra); font-weight: 700; margin-bottom: .6em; }
.lead { font-size: 1.08rem; color: var(--ink-muted); }
.muted { color: var(--ink-muted); font-size: .92rem; }
.small { font-size: .85rem; }
em { font-style: italic; }

/* Karten */
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 22px 20px; box-shadow: var(--shadow); margin-bottom: 18px;
}
.card.sand { background: var(--sand); box-shadow: none; }
.card ul { padding-left: 1.2em; margin: 0 0 .9em; }
.card li { margin-bottom: .45em; }
.card table { width: 100%; border-collapse: collapse; font-size: .9rem; margin-bottom: .6em; }
.card th, .card td { text-align: left; vertical-align: top; padding: 8px 6px; border-bottom: 1px solid var(--line); }
.card th { font-weight: 700; color: var(--bark); }
.arrow { background: var(--sand); border-left: 3px solid var(--terra); padding: 10px 12px; border-radius: 6px; }
.table-scroll { overflow-x: auto; }

/* Datenschutz-Stufen */
.steps { list-style: none; padding: 0; margin: 0; }
.steps li { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.steps li:last-child { border-bottom: 0; }
.steps .num {
  flex: 0 0 28px; height: 28px; border-radius: 50%; background: var(--olive); color: #fff;
  display: grid; place-items: center; font-weight: 700; font-size: .85rem;
}

/* Formulare */
label.field { display: block; font-weight: 700; margin: 0 0 6px; }
input[type=text], input[type=number], textarea {
  width: 100%; font: inherit; color: inherit; background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px;
}
textarea { min-height: 96px; resize: vertical; }
input:focus, textarea:focus { outline: 2px solid var(--gold); outline-offset: 1px; border-color: var(--gold); }
.check { display: flex; gap: 10px; align-items: flex-start; margin: 14px 0; cursor: pointer; }
.check input { width: 20px; height: 20px; margin-top: 3px; accent-color: var(--terra); flex: 0 0 auto; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font: 700 1rem var(--sans); border: 0; border-radius: 99px; cursor: pointer;
  padding: 13px 26px; background: var(--terra); color: #fff; transition: background .2s, transform .1s;
}
.btn:hover { background: var(--terra-deep); }
.btn:active { transform: scale(.98); }
.btn:disabled { background: var(--sand-deep); color: var(--ink-muted); cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--ink-muted); padding: 10px 14px; }
.btn.ghost:hover { color: var(--bark); background: var(--sand); }
.btn.secondary { background: var(--surface); color: var(--bark); border: 1px solid var(--line); }
.btn.secondary:hover { background: var(--sand); }
.actions { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 22px; flex-wrap: wrap; }

/* Fragen */
.qnum { color: var(--ink-muted); font-size: .9rem; margin-bottom: 4px; }
.question { font-family: var(--serif); font-size: clamp(1.5rem, 4.6vw, 1.9rem); line-height: 1.2; color: var(--bark); margin: 0 0 6px; font-weight: 600; }
.qhint { color: var(--ink-muted); font-style: italic; margin-bottom: 14px; }
.options { display: grid; gap: 10px; margin-top: 18px; }
.option {
  text-align: left; font: inherit; color: inherit; cursor: pointer;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px;
  padding: 14px 16px; transition: border-color .15s, background .15s;
}
.option:hover { border-color: var(--gold); }
.option.selected { border-color: var(--terra); background: #FBF1EB; box-shadow: inset 0 0 0 1px var(--terra); }
.option:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* Ergebnis */
.hero-type { text-align: center; padding: 30px 20px; background: var(--bark); color: var(--sand); border-radius: var(--radius); margin-bottom: 18px; }
.hero-type .icon { font-size: 3rem; line-height: 1; }
.hero-type h1 { color: #fff; margin: 10px 0 4px; }
.hero-type .sub { color: var(--gold-soft); font-size: 1rem; }

.compass { display: grid; grid-template-columns: auto 1fr 1fr; gap: 6px; font-size: .78rem; margin: 6px 0 4px; }
.compass .axis { color: var(--ink-muted); display: flex; align-items: center; justify-content: center; text-align: center; padding: 2px; }
.compass .axis.v { writing-mode: vertical-rl; transform: rotate(180deg); }
.compass .cell { border-radius: 10px; padding: 12px 8px; text-align: center; background: var(--sand); color: var(--ink-muted); border: 1.5px solid transparent; }
.compass .cell b { display: block; font-family: var(--serif); font-size: 1.15rem; color: var(--bark); }
.compass .cell.main { background: #FBF1EB; border-color: var(--terra); }
.compass .cell.second { border-color: var(--gold); border-style: dashed; }

.bars { display: grid; gap: 8px; margin-top: 10px; }
.bar { display: grid; grid-template-columns: 92px 1fr 22px; align-items: center; gap: 10px; font-size: .9rem; }
.bar .track { height: 10px; background: var(--sand); border-radius: 99px; overflow: hidden; }
.bar .fill { height: 100%; background: var(--gold); border-radius: 99px; }
.bar.main .fill { background: var(--terra); }

.drivers { display: grid; gap: 10px; }
.driver { display: flex; gap: 12px; align-items: flex-start; }
.driver .rank { flex: 0 0 30px; height: 30px; border-radius: 50%; background: var(--gold); color: #fff; display: grid; place-items: center; font-weight: 700; }
.satz { font-family: var(--serif); font-size: 1.4rem; font-style: italic; color: var(--terra-deep); text-align: center; padding: 14px 8px 4px; }

/* Ziele */
.suggest { background: var(--sand); border-radius: 10px; padding: 10px 12px; margin: 10px 0 12px; font-size: .92rem; }
.suggest b { color: var(--olive); }
.num-row { display: grid; grid-template-columns: 1fr 96px; gap: 10px; align-items: center; margin-bottom: 10px; }
.chips { display: grid; gap: 8px; }
.chips.three { grid-template-columns: repeat(3, 1fr); margin-top: 16px; }

/* Übersicht: zwei gleichwertige Wege */
.paths { display: grid; gap: 12px; margin: 22px 0 8px; }
.path {
  display: flex; gap: 14px; align-items: flex-start; text-align: left; width: 100%;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--radius);
  padding: 18px 16px; font: inherit; color: var(--ink); cursor: pointer; box-shadow: var(--shadow);
}
.path:hover { border-color: var(--terra); }
.path:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.path strong { display: block; font-family: var(--serif); font-size: 1.4rem; color: var(--bark); line-height: 1.15; }
.path-icon { font-size: 1.8rem; line-height: 1; flex: 0 0 auto; }
.path-time { display: block; font-size: .82rem; color: var(--terra); font-weight: 700; margin: 2px 0 6px; }
.path-text { display: block; color: var(--ink-muted); font-size: .95rem; }

/* Wortstil-Probe */
textarea.short { min-height: 56px; }
.bubble {
  background: #E7F3DF; color: var(--ink); border-radius: 14px 14px 14px 4px; padding: 12px 14px;
  margin: 14px 0; white-space: pre-wrap; overflow-wrap: anywhere; max-width: 92%;
}
.thinking { display: flex; gap: 10px; align-items: center; color: var(--ink-muted); }
.thinking .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--gold); flex: 0 0 auto; animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }

/* Freigabe */
.toggle { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.toggle:last-of-type { border-bottom: 0; }
.switch { position: relative; flex: 0 0 52px; height: 30px; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch .slider { position: absolute; inset: 0; background: var(--sand-deep); border-radius: 99px; cursor: pointer; transition: background .2s; }
.switch .slider::before { content: ''; position: absolute; width: 24px; height: 24px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.switch input:checked + .slider { background: var(--olive); }
.switch input:checked + .slider::before { transform: translateX(22px); }
.switch input:focus-visible + .slider { outline: 2px solid var(--gold); outline-offset: 2px; }

.sponsor-view { border: 2px dashed var(--olive); border-radius: var(--radius); padding: 18px; background: var(--surface); }
.sponsor-view .eyebrow { color: var(--olive); }
.sponsor-view .empty { color: var(--ink-muted); font-style: italic; }
.kv { display: grid; grid-template-columns: 140px 1fr; gap: 6px 12px; font-size: .95rem; margin: 0 0 10px; }
.kv dt { color: var(--ink-muted); }
.kv dd { margin: 0; }

.notice { font-size: .88rem; background: #F4F6EE; border: 1px solid #DCE3CC; color: #4B5735; border-radius: 10px; padding: 10px 12px; margin: 12px 0; }

@media (max-width: 480px) {
  .kv { grid-template-columns: 1fr; gap: 0 0; }
  .kv dt { margin-top: 8px; }
  .bar { grid-template-columns: 76px 1fr 18px; }
}

@media print {
  .topbar, .progress, .actions, .no-print, .foot { display: none !important; }
  body { background: #fff; font-size: 12pt; }
  .card { box-shadow: none; break-inside: avoid; }
  .hero-type { background: #fff; color: var(--ink); border: 2px solid var(--bark); }
  .hero-type h1 { color: var(--bark); }
}

/* Bewegung reduzieren, wenn gewünscht */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

<script>
// Adresse der Server-Funktion „wortstil“ (Supabase). Leer = keine KI außerhalb des Claude-Testlinks.

<script>
// KOPIE von supabase/functions/_shared/wortstil-prompts.js — dort ändern, dann node tools/build-data.mjs
/* Wortstil-Probe: Prompts und feste Regeln an EINER Stelle.
   Wird von der Server-Funktion (supabase/functions/wortstil) und vom Prototyp benutzt.
   Klassisches Skript ohne import/export: setzt globalThis.WORTSTIL.
   Der Prototyp bekommt eine Kopie über `node tools/build-data.mjs`. Hier ändern, nicht in der Kopie. */
(function () {
  const FIELDS = [
    ['satzlaenge', 'Satzlänge'], ['anrede', 'Anrede / Begrüßung'], ['verabschiedung', 'Verabschiedung'],
    ['emojis', 'Emojis'], ['ton', 'Ton'], ['schreibweise', 'Schreibweise'],
    ['lieblingswoerter', 'Lieblingswörter'], ['nie', 'Würde nie sagen'], ['sprache', 'Sprachnachricht vs. Text'],
  ];

  // Feste Regeln aus „01 Wortstil-Probe“ (freigegeben 19.10.2026)
  const RULES = [
    'keine Heilversprechen und keine Einkommensversprechen',
    'keine Krankheiten oder Beschwerden nennen, auch nicht indirekt (z. B. „hilft bei Rückenschmerzen“)',
    'keine Vergleiche mit Medikamenten oder Therapien',
    'keine Anzahl der Patches nennen',
    'keine Preise nennen',
    'keine 7er-Probierpakete erwähnen',
    'kein Druck und keine künstliche Knappheit („nur noch heute“, „schnell sein“)',
    'kein Business-Angebot',
    'kein Werbesprech',
  ];

  // Obergrenzen, damit niemand die KI mit langen Texten füttert (Zeichen)
  const MAX = { sample: 2000, voice: 3000, field: 300, draft: 2000, feedback: 600 };

  const clip = (s, n) => String(s == null ? '' : s).trim().slice(0, n);

  function steckbriefPrompt(p) {
    return `Eine Person baut nebenberuflich ein kleines Business auf und schreibt ihren Kontakten persönlich, meist per WhatsApp. Eine App soll später Nachrichtenentwürfe in IHREM Ton schreiben. Erstelle dafür aus ihren Schreibproben einen Wortstil-Steckbrief.

Regeln:
- Beschreibe nur, was in den Proben wirklich zu sehen ist. Erfinde nichts.
- Schreib auf Deutsch, sprich die Person mit „du“ an („Du schreibst …“). Jeder Punkt höchstens ein kurzer Satz, wo möglich mit 1–2 echten Beispielen aus den Proben in „…“.
- Kommt ein Merkmal in den Proben nicht vor, schreib „nicht erkennbar“.
- „schreibweise“: z. B. ss statt ß, Groß-/Kleinschreibung, Dialekt, Abkürzungen.
- „nie“: Wörter oder Formen, die zu diesem Ton gar nicht passen würden (z. B. Sie-Form, Werbesprech). Beginne mit „Vermutlich:“.
- „sprache“: nur wenn es eine Sprachprobe gibt, vergleiche Sprechen und Schreiben (z. B. „spricht lockerer und länger als geschrieben“). Ohne Sprachprobe: null.

Antworte nur mit JSON in genau dieser Form:
{"satzlaenge":"…","anrede":"…","verabschiedung":"…","emojis":"…","ton":"…","schreibweise":"…","lieblingswoerter":"…","nie":"…","sprache":null}

Probe 1 (an jemanden aus dem Freundeskreis: was ich am Wochenende gemacht habe):
${clip(p.s1, MAX.sample)}

Probe 2 (an jemanden aus dem Freundeskreis: etwas Neues, das ich ausprobiert habe und das mir gefällt):
${clip(p.s2, MAX.sample)}

Probe 3 (jemand hat sich zwei Wochen nicht gemeldet, ich frage nach):
${clip(p.s3, MAX.sample)}

Sprachprobe (diktiert: warum ich dabei bin):
${clip(p.voice, MAX.voice) || '(keine Sprachprobe)'}`;
  }

  // Nur der Steckbrief geht in den Entwurf, nicht die Schreibproben.
  function draftPrompt(profile, previous, feedback) {
    const p = profile || {};
    const lines = FIELDS.filter(([k]) => p[k]).map(([k, label]) => `- ${label}: ${clip(p[k], MAX.field)}`).join('\n');
    let prompt = `Schreib eine kurze WhatsApp-Nachricht im Namen einer Person, genau in ihrem Wortstil. So schreibt sie:
${lines}

Situation: Erstkontakt. Die Person schreibt jemandem aus ihrem Bekanntenkreis, von dem sie länger nichts gehört hat. Sie hat selbst etwas Neues ausprobiert, das ihr gefällt, und will neugierig machen, ohne zu erklären, was es ist oder wofür es gut ist. Die Nachricht endet mit einer leichten, offenen Frage, ganz ohne Druck. 2 bis 5 Sätze. Statt eines Namens steht [Name]. Keine Anrede, die nur zu Frauen oder nur zu Männern passt.

Feste Regeln:
${RULES.map((r) => `- ${r}`).join('\n')}

Antworte nur mit dem Text der Nachricht, ohne Anführungszeichen und ohne Erklärung.`;
    if (clip(feedback, MAX.feedback) && clip(previous, MAX.draft)) {
      prompt += `

Der vorige Entwurf war:
${clip(previous, MAX.draft)}

Rückmeldung der Person dazu: ${clip(feedback, MAX.feedback)}
Schreib einen neuen Entwurf, der diese Rückmeldung umsetzt.`;
    }
    return prompt;
  }

  // Liest das Steckbrief-JSON tolerant (ganzer Text, Code-Block oder erstes {…}).
  function parseProfile(text) {
    const t = String(text || '');
    const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/);
    const candidates = [t, fence && fence[1], t.slice(t.indexOf('{'), t.lastIndexOf('}') + 1)];
    for (const c of candidates) {
      if (!c) continue;
      try {
        const obj = JSON.parse(c);
        if (obj && typeof obj === 'object') {
          return Object.fromEntries(FIELDS.map(([k]) => [k, typeof obj[k] === 'string' ? obj[k] : '']));
        }
      } catch (_) { /* nächster Versuch */ }
    }
    return null;
  }

  globalThis.WORTSTIL = { FIELDS, RULES, MAX, steckbriefPrompt, draftPrompt, parseProfile };
})();

 "results": {
  "anker": {

   "tickst": "<p>Bei dir fühlen sich Menschen sicher. Du hörst zu, bevor du redest, und merkst oft früher als andere, wenn es jemandem nicht gut geht. Eine Bühne brauchst du nicht, du brauchst echte Verbindung.</p>\n<p>Entscheidungen triffst du nicht übers Knie gebrochen. Du sprichst vorher mit Menschen, denen du vertraust. Und wenn du einmal Ja gesagt hast, bleibst du dran.</p>",
   "staerke": "<p>Du machst ohnehin schon das, worauf es ankommt: Du pflegst Beziehungen. Ein Business, das von Vertrauen und Empfehlungen lebt, baut genau darauf auf.</p>\n<ul><li>Deine Kontakte glauben dir. Du willst nichts verkaufen, du erzählst, was du selbst erlebt hast.</li><li>Du fasst nach, weil dir der Mensch wichtig ist und nicht der Abschluss. Deshalb bleiben deine Kunden.</li><li>Kundenpflege liegt dir: nachfragen, wie es geht, einfach da sein.</li></ul>",
   "stolperstein": "<p>Du willst niemandem zur Last fallen. Deshalb wartest du manchmal, bis jemand von selbst fragt, und das passiert selten. Vielleicht kennst du den Gedanken: <em>„Ich will nicht aufdringlich sein.“</em></p>\n<p>Dabei ist es keine Zumutung, von etwas Gutem zu erzählen, das du für dich entdeckt hast. Es ist eine Einladung, die der andere annehmen oder ablehnen darf. Und wenn jemand Nein sagt, gilt das dem Angebot, nicht dir.</p>",

<script>
/* Der Freiheits-Kompass — klickbarer Prototyp.
   Alles läuft im Browser. Es wird nichts gespeichert oder verschickt:
   Neu laden = alles weg. Inhalte stammen aus data.js (erzeugt aus Persoenlichkeitsprofil/*.md). */
(function () {
  'use strict';
  const D = window.KOMPASS_DATA;
  const app = document.getElementById('app');
  const progressBar = document.getElementById('progress');
  const brandSub = document.querySelector('.brand span');

  // ---------- Stammdaten, die nicht in den Ergebnistexten stehen (aus dem Fragenkatalog) ----------
  const TYPES = {
    pfeil:    { icon: '🏹', name: 'Pfeil',    tempo: 'schnell', fokus: 'Sache' },
    funke:    { icon: '✨', name: 'Funke',    tempo: 'schnell', fokus: 'Menschen' },
    anker:    { icon: '⚓', name: 'Anker',    tempo: 'bedacht', fokus: 'Menschen' },
    kristall: { icon: '💎', name: 'Kristall', tempo: 'bedacht', fokus: 'Sache' },
  };
  const TYPE_ORDER = ['pfeil', 'funke', 'anker', 'kristall'];

  const DRIVERS = {
    freiheit:    { name: 'Freiheit',    text: 'Du willst selbst bestimmen, wie, wann und wo du arbeitest.' },
    sicherheit:  { name: 'Sicherheit',  text: 'Dir gibt es Kraft, abgesichert zu sein und nicht von einer einzigen Quelle abzuhängen.' },
    anerkennung: { name: 'Anerkennung', text: 'Dich treibt an, wenn gesehen wird, was du leistest.' },
    beitrag:     { name: 'Beitrag',     text: 'Dich treibt an, wenn es anderen Menschen durch dich besser geht.' },
    wachstum:    { name: 'Wachstum',    text: 'Dich treibt an, über dich hinauszuwachsen und Neues zu lernen.' },
  };
  const DRIVER_ORDER = ['freiheit', 'sicherheit', 'anerkennung', 'beitrag', 'wachstum'];

  const PART_C = [
    { id: 'C1', key: 'hours', text: 'Wie viele Stunden pro Woche hast du realistisch – nicht im Idealfall?',
      hint: 'Das kannst du jederzeit ändern.',
      options: [['h0', 'unter 3'], ['h1', '3–5'], ['h2', '5–10'], ['h3', 'mehr als 10']] },
    { id: 'C2', key: 'energy', text: 'Wann hast du die meiste Energie?',
      options: [['frueh', 'früh morgens'], ['vormittag', 'vormittags'], ['nachmittag', 'nachmittags'], ['abend', 'abends']] },
    { id: 'C3', key: 'channels', multi: true, text: 'Wie gehst du am liebsten auf Menschen zu?', hint: 'Mehrere Antworten möglich.',
      options: [['persoenlich', 'persönlich treffen'], ['telefon', 'Telefon'], ['sprach', 'Sprachnachricht'], ['chat', 'Schreiben / Chat'], ['social', 'Posts & Stories'], ['events', 'Veranstaltungen']] },
    { id: 'C4', key: 'learn', text: 'Wie lernst du am besten?',
      options: [['video', 'Zuschauen (Video)'], ['lesen', 'Lesen'], ['probieren', 'Einfach ausprobieren'], ['gemeinsam', 'Gemeinsam mit jemandem']] },
    { id: 'C5', key: 'note', free: true, text: 'Was sollte dein Sponsor über dich wissen, damit die Zusammenarbeit gut läuft?',
      hint: 'Freiwillig. Das sieht dein Sponsor nur, wenn du den Bereich „Rahmen“ freigibst.' },
  ];

  const D1_PREFIX = {
    freiheit: 'Ich will selbst bestimmen, wann und wo ich arbeite, weil ',
    sicherheit: 'Ich will ein zweites Standbein, damit ',
    anerkennung: 'Ich will mir und anderen zeigen, dass ',
    beitrag: 'Ich will, dass es Menschen in meinem Umfeld besser geht, weil ',
    wachstum: 'Ich will über mich hinauswachsen, weil ',
  };
  const D2_SUGGEST = {
    freiheit: 'Ein Tag pro Woche gehört nur mir.',
    sicherheit: 'Ich lege jeden Monat einen festen Betrag zurück: ___ € / CHF.',
    anerkennung: 'Ich begleite ein eigenes kleines Team.',
    beitrag: 'Eine feste Gruppe von Kunden, denen es durch mich besser geht.',
    wachstum: 'Ich führe Gespräche, vor denen ich heute noch Respekt habe.',
  };
  // D3: Vorschlag pro Monat nach Stunden (Fragenkatalog). Kontakte pro Woche = Prototyp-Annahme.
  const D3_BY_HOURS = {
    h0: { kunden: 2, partner: 0, kontakte: 3, text: '2 neue Kunden pro Monat' },
    h1: { kunden: 3, partner: 0, kontakte: 5, text: '3 neue Kunden pro Monat' },
    h2: { kunden: 3, partner: 1, kontakte: 8, text: '3 neue Kunden + 1 Partner pro Monat' },
    h3: { kunden: 3, partner: 3, kontakte: 14, text: 'Monat 1: 3 Kunden + 3 Partner, danach 2 Kunden + 1 Partner pro Monat' },
  };
  const D4_SUGGEST = {
    pfeil: 'Erst fragen, dann erzählen.',
    funke: 'Jeden Kontakt innerhalb von 7 Tagen nachfassen.',
    anker: 'Ich lade ein, ohne mich dafür zu entschuldigen.',
    kristall: 'Ich führe Gespräche, bevor ich alles weiß.',
  };

  // ---------- Wortstil-Probe (aus 01 Wortstil-Probe, freigegeben 19.10.2026) ----------
  const WS_SAMPLES = [
    { key: 's1', text: 'Erzähl jemandem aus deinem Freundeskreis per WhatsApp, was du am Wochenende gemacht hast.' },
    { key: 's2', text: 'Du hast etwas Neues ausprobiert, das dir gefällt. Schreib es so, wie du es jemandem aus deinem Freundeskreis schicken würdest.' },
    { key: 's3', text: 'Jemand hat sich zwei Wochen nicht gemeldet. Wie fragst du nach?' },
  ];
  // Felder, Regeln und Prompts liegen in wortstil-prompts.js (gemeinsam mit der Server-Funktion).
  const W = window.WORTSTIL;
  const WS_FIELDS = W.FIELDS;
  // KI im Hintergrund, zwei Wege:
  // 1. im Claude-Testlink über die Fähigkeit „sample“ (Konto der Testperson, bezahlt),
  // 2. sonst über die Server-Funktion der App (KOMPASS_AI_URL aus config.js, mit Testcode).
  const IN_CLAUDE = !!(window.claude && typeof window.claude.use === 'function');
  const AI_URL = IN_CLAUDE ? '' : String(window.KOMPASS_AI_URL || '').trim();
  const samplePromise = IN_CLAUDE ? window.claude.use('sample').catch(() => null) : Promise.resolve(null);
  const urlCode = (() => { try { return new URLSearchParams(location.search).get('code') || ''; } catch (_) { return ''; } })();
  const newWs = () => ({
    consent: false, code: urlCode, s1: '', s2: '', s3: '', voice: '',
    profile: null, status: 'idle', error: '',
    draft: '', draftStatus: 'idle', draftError: '', verdict: null, feedback: '',
  });

  // ---------- Zustand (nur im Arbeitsspeicher) ----------
  const state = {
    flow: null, // null = Übersicht · 'kompass' · 'wortstil'
    name: '', consent: false,
    a: {}, b: {}, c: { channels: [] },
    d: null, share: { ziele: false, fuehrung: false, rahmen: false },
    order: {}, step: 0,
    ws: newWs(),
  };

  const WORTSTIL_SCREENS = [
    { kind: 'ws-start' },
    ...WS_SAMPLES.map((q, i) => ({ kind: 'ws-sample', q, n: i + 1, of: WS_SAMPLES.length })),
    { kind: 'ws-voice' },
    { kind: 'ws-profile' },
    { kind: 'ws-draft' },
    { kind: 'ws-done' },
  ];

  const KOMPASS_SCREENS = [
    { kind: 'start' },
    { kind: 'intro', part: 'A', title: 'Teil A · Dein Grundtyp', text: '12 kurze Fragen. Denk nicht lange nach. Nimm die Antwort, die dir als Erstes einfällt, so wie es wirklich war.' },
    ...D.partA.map((q, i) => ({ kind: 'choice', part: 'a', q, n: i + 1, of: D.partA.length })),
    { kind: 'intro', part: 'B', title: 'Teil B · Dein Antrieb', text: '6 Fragen dazu, was dich wirklich bewegt. Auch hier gibt es kein Richtig oder Falsch.' },
    ...D.partB.map((q, i) => ({ kind: 'choice', part: 'b', q, n: i + 1, of: D.partB.length })),
    { kind: 'intro', part: 'C', title: 'Teil C · Dein Rahmen', text: 'Zum Schluss ein paar praktische Fragen zu deiner Zeit und deiner Art zu arbeiten.' },
    ...PART_C.map((q, i) => ({ kind: 'rahmen', q, n: i + 1, of: PART_C.length })),
    { kind: 'result' },
    { kind: 'goal', id: 'D1' }, { kind: 'goal', id: 'D2' }, { kind: 'goal', id: 'D3' }, { kind: 'goal', id: 'D4' },
    { kind: 'profile' },
  ];
  const screens = () => (state.flow === 'wortstil' ? WORTSTIL_SCREENS : KOMPASS_SCREENS);

  // ---------- Hilfen ----------
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const firstName = () => esc(state.name.trim()) || '[Vorname]';
  const sponsorText = (html) => html.replace(/\[Vorname\]/g, firstName());

  function shuffled(id, options) {
    if (!state.order[id]) {
      const idx = options.map((_, i) => i);
      for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
      state.order[id] = idx;
    }
    return state.order[id].map((i) => options[i]);
  }

  // ---------- Auswertung (läuft nur hier im Browser) ----------
  function evaluate() {
    const counts = Object.fromEntries(TYPE_ORDER.map((t) => [t, 0]));
    Object.values(state.a).forEach((t) => counts[t]++);
    const a12 = state.a.A12; // Gleichstand: Antwort auf A12 entscheidet die Reihenfolge
    const ranked = [...TYPE_ORDER].sort((x, y) => counts[y] - counts[x] || (y === a12) - (x === a12) || TYPE_ORDER.indexOf(x) - TYPE_ORDER.indexOf(y));
    const main = ranked[0], second = ranked[1];
    const bridge = counts[main] === counts[second];

    const dcounts = Object.fromEntries(DRIVER_ORDER.map((d) => [d, 0]));
    Object.values(state.b).forEach((d) => dcounts[d]++);
    const b6 = state.b.B6; // Gleichstand: Antwort auf B6 entscheidet
    const drivers = [...DRIVER_ORDER].sort((x, y) => dcounts[y] - dcounts[x] || (y === b6) - (x === b6) || DRIVER_ORDER.indexOf(x) - DRIVER_ORDER.indexOf(y)).slice(0, 2);

    return { counts, main, second, bridge, drivers };
  }

  function initGoals(r) {
    if (state.d) return;
    const base = D3_BY_HOURS[state.c.hours || 'h1'];
    const slow = r.main === 'anker' || r.main === 'kristall';
    state.d = {
      memory: '',
      warum: D1_PREFIX[r.drivers[0]],
      ziel12: D2_SUGGEST[r.drivers[0]],
      kunden: base.kunden,
      partner: slow ? (state.c.hours === 'h3' ? 1 : base.partner) : base.partner,
      kontakte: base.kontakte,
      wachstum: D4_SUGGEST[r.main],
      wachstumOwn: false,
    };
  }

  // ---------- Navigation ----------
  function go(step) {
    state.step = Math.max(0, Math.min(screens().length - 1, step));
    render();
    window.scrollTo(0, 0);
    const h = app.querySelector('h1, h2, .question');
    if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
  }
  const next = () => go(state.step + 1);
  const back = () => go(state.step - 1);
  const openFlow = (flow) => { state.flow = flow; go(0); };

  function backBtn(label = 'Zurück') { return `<button class="btn ghost" data-act="back">← ${label}</button>`; }

  // ---------- Bildschirme ----------
  function viewStart() {
    return `
      <div class="eyebrow">Dein Profil in der App</div>
      <h1>Der Freiheits-Kompass</h1>
      <p class="lead">In etwa 10–15 Minuten erfährst du, wie du tickst, was dich antreibt und wie du dein Business so aufbaust, dass es zu dir passt.</p>

      <div class="card">
        <h3 style="margin-top:0">So bleiben deine Antworten bei dir</h3>
        <ul class="steps">
          <li><span class="num">1</span><div><strong>Deine einzelnen Antworten</strong> werden nur hier auf deinem Gerät ausgewertet und <strong>nie gespeichert</strong>.</div></li>
          <li><span class="num">2</span><div><strong>Deine Auswertung</strong> liegt in deinem Profil. Nur du kannst sie lesen.</div></li>
          <li><span class="num">3</span><div><strong>Dein Sponsor</strong> sieht nur, was du am Ende selbst freigibst: Ziele, Führungshinweise, Rahmen. Deinen Typ und deine Antriebe sieht er nicht. Du kannst die Freigabe jederzeit zurücknehmen.</div></li>
        </ul>
        <p class="muted small" style="margin-top:10px">Hinweis: Wer das Modell kennt, kann aus den Führungshinweisen deinen Typ ungefähr ableiten.</p>
      </div>

      <label class="field" for="name">Dein Vorname</label>
      <input type="text" id="name" autocomplete="given-name" value="${esc(state.name)}" placeholder="z. B. Maria">
      <p class="muted small" style="margin-top:6px">Im Prototyp nur für die Vorschau der Sponsor-Ansicht.</p>

      <label class="check"><input type="checkbox" id="consent" ${state.consent ? 'checked' : ''}>
        <span>Ich habe verstanden, was gespeichert wird, was nie gespeichert wird und was ich teilen kann.</span></label>

      <div class="notice">Prototyp: Hier wird gar nichts gespeichert. Wenn du die Seite neu lädst, beginnt alles von vorn.</div>

      <div class="actions"><button class="btn ghost" data-act="home">← Übersicht</button><button class="btn" data-act="next" id="startBtn" ${state.consent ? '' : 'disabled'}>Los geht's</button></div>`;
  }

  // ---------- Übersicht: Freiheits-Kompass oder direkt die Wortstil-Probe ----------
  function viewHome() {
    return `
      <div class="eyebrow">Willkommen</div>
      <h1>Womit möchtest du starten?</h1>
      <p class="lead">Du entscheidest selbst. Beides ist freiwillig, und das andere kannst du später jederzeit nachholen.</p>
      <div class="paths">
        <button class="path" data-act="open-kompass">
          <span class="path-icon" aria-hidden="true">🧭</span>
          <span><strong>Der Freiheits-Kompass</strong><span class="path-time">10–15 Minuten</span>
          <span class="path-text">Fragen dazu, wie du tickst und was dich antreibt. Am Ende stehen dein Profil und vier Ziele, die zu dir passen.</span></span>
        </button>
        <button class="path" data-act="open-wortstil">
          <span class="path-icon" aria-hidden="true">✍️</span>
          <span><strong>Meine Wortstil-Probe</strong><span class="path-time">ca. 10 Minuten · kein Test</span>
          <span class="path-text">Du schreibst drei kurze Nachrichten, so wie du sie jemandem aus deinem Freundeskreis schicken würdest. Daraus lernt die App deinen Ton, damit Nachrichtenentwürfe später klingen wie du.</span></span>
        </button>
      </div>
      <div class="notice">Prototyp: Hier wird gar nichts gespeichert. Wenn du die Seite neu lädst, beginnt alles von vorn.</div>`;
  }

  // ---------- Wortstil-Probe ----------
  function viewWsStart() {
    const ws = state.ws;
    return `
      <div class="eyebrow">Deine Wortstil-Probe</div>
      <h1>So klingt deine Stimme</h1>
      <p class="lead">Die App schreibt dir später Entwürfe für deine Nachrichten. Sie sollen klingen wie du und nicht wie ein Werbetext. Dafür braucht sie drei kurze Schreibproben von dir.</p>

      <div class="card">

  const wsErrorText = (e) => ({
    not_granted: 'Ohne deine Erlaubnis kann Claude die Proben nicht auswerten. Du kannst die Seite neu laden und es nochmal versuchen.',
    sampling_disabled: 'Claude ist für dein Konto gerade nicht verfügbar.',

    server_config: 'Die KI ist gerade nicht richtig eingerichtet. Gib Tanja bitte kurz Bescheid.',

  // Server-Funktion der App (supabase/functions/wortstil). Fehler kommen als {error} zurück.
  async function callServer(payload) {
    let res;
    try {
      res = await fetch(AI_URL, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ ...payload, code: state.ws.code.trim() }),
      });
    } catch (_) {
      throw { code: 'network' };
    }
    let data = {};
    try { data = await res.json(); } catch (_) { /* leer */ }
    if (!res.ok || data.error) throw { code: data.error || 'upstream_error' };
    return data;
  }

  const onWsScreen = (kind) => state.flow === 'wortstil' && screens()[state.step].kind === kind;

  async function runAnalysis(fresh) {
    const ws = state.ws;
    ws.status = 'loading'; ws.errorCode = ''; ws.attempts = (ws.attempts || 0) + 1;
    render();
    const sample = await samplePromise;
    if (!sample && !AI_URL) {
      ws.status = 'unavailable';
      if (!ws.profile) ws.profile = Object.fromEntries(WS_FIELDS.filter(([k]) => k !== 'sprache').map(([k]) => [k, '']));
      if (onWsScreen('ws-profile')) render();
      return;
    }
    try {
      const res = sample
        ? await sample.json(W.steckbriefPrompt(ws), fresh ? { cache: false } : {})
        : (await callServer({ action: 'steckbrief', samples: { s1: ws.s1, s2: ws.s2, s3: ws.s3, voice: ws.voice } })).profile;
      ws.profile = Object.fromEntries(WS_FIELDS.map(([k]) => [k, res && typeof res[k] === 'string' ? res[k] : '']));
      ws.status = 'done'; ws.attempts = 0;
      ws.draft = ''; ws.verdict = null; ws.feedback = '';
    } catch (e) {
      console.error('Steckbrief:', e);
      ws.status = 'error';
      ws.errorCode = (e && e.code) || '';
      ws.error = wsErrorText(e);
    }
    if (onWsScreen('ws-profile')) render();
  }

  async function runDraft() {
    const ws = state.ws;
    ws.draftStatus = 'loading'; ws.draftError = ''; ws.attempts = (ws.attempts || 0) + 1;
    // Bei „Fast“/„Gar nicht“ gehen der vorige Entwurf und die Rückmeldung mit.
    const previous = ws.feedback.trim() ? ws.draft : '';
    const feedback = previous ? ws.feedback : '';
    ws.draft = ''; ws.verdict = null;
    render();
    const sample = await samplePromise;
    if (!sample && !AI_URL) {
      ws.draftStatus = 'error';
      ws.draftError = NO_AI;
      if (onWsScreen('ws-draft')) render();
      return;
    }
    try {
      let text;
      if (sample) {
        ({ text } = await sample(W.draftPrompt(ws.profile, previous, feedback), {
          ...(previous ? { cache: false } : {}),
          onText: ({ text }) => {
            ws.draft = text;
            const b = onWsScreen('ws-draft') && app.querySelector('.bubble');
            if (b) b.textContent = text; else if (onWsScreen('ws-draft')) render();
          },
        }));
      } else {
        ({ text } = await callServer({ action: 'entwurf', profile: ws.profile, previous, feedback }));
      }
      ws.draft = String(text || '').trim();
      ws.draftStatus = 'done'; ws.attempts = 0;
      ws.feedback = '';
    } catch (e) {
      console.error('Beispielnachricht:', e);
      ws.draft = '';
      ws.draftStatus = 'error';
      ws.draftError = wsErrorText(e);
    }
    if (onWsScreen('ws-draft')) render();
  }

        <div class="notice">Das ist dein Ziel, keine Zusage. Niemand verspricht dir ein Einkommen.</div>`;
    } else if (s.id === 'D4') {
      body = `${head(4, 'Dein Wachstumsziel')}
        <p class="field">Was willst du in diesem Jahr an dir selbst entwickeln?</p>
        <div class="chips">
          <button class="option ${!g.wachstumOwn ? 'selected' : ''}" data-wachstum="suggest">Vorschlag: „${esc(D4_SUGGEST[r.main])}“</button>
          <button class="option ${g.wachstumOwn ? 'selected' : ''}" data-wachstum="own">Ich formuliere mein eigenes Ziel</button>
        </div>
        ${g.wachstumOwn ? `<textarea id="wachstum" data-goal="wachstum" style="margin-top:12px" placeholder="Mein Wachstumsziel …">${esc(g.wachstum === D4_SUGGEST[r.main] ? '' : g.wachstum)}</textarea>` : ''}`;
    }
    return `${body}
      <div class="actions">${backBtn()}<button class="btn" data-act="next">${s.id === 'D4' ? 'Mein Profil ansehen' : 'Weiter'}</button></div>`;
  }

  function rahmenList() {
    const label = (key, v) => PART_C.find((q) => q.key === key).options.find(([k]) => k === v)?.[1] || '–';
    return `<dl class="kv">
      <dt>Zeit pro Woche</dt><dd>${esc(label('hours', state.c.hours))} Std.</dd>
      <dt>Meiste Energie</dt><dd>${esc(label('energy', state.c.energy))}</dd>
      <dt>Lieblingskanäle</dt><dd>${esc(state.c.channels.map((v) => label('channels', v)).join(', ') || '–')}</dd>
      <dt>Lernt am besten</dt><dd>${esc(label('learn', state.c.learn))}</dd>
      ${state.c.note ? `<dt>Was du über mich wissen solltest</dt><dd>${esc(state.c.note)}</dd>` : ''}
    </dl>`;
  }

  function goalsList() {
    const g = state.d;
    const r = evaluate();
    const slow = r.main === 'anker' || r.main === 'kristall';
    const partner = g.partner > 0
      ? `${esc(g.partner)} Partner pro Monat${slow ? ' (ab Monat 2)' : ''}`
      : 'noch kein Partnerziel';
    return `<dl class="kv">
      <dt>WARUM</dt><dd>${esc(g.warum) || '–'}</dd>
      <dt>In 12 Monaten</dt><dd>${esc(g.ziel12) || '–'}</dd>
      <dt>Kunden / Partner</dt><dd>${esc(g.kunden)} neue Kunden pro Monat · ${partner} · ${esc(g.kontakte)} neue Kontakte pro Woche</dd>
      <dt>Wachstumsziel</dt><dd>${esc(g.wachstum) || '–'}</dd>
    </dl>`;
  }

  function sponsorPreview(r) {
    const S = D.results[r.main].sponsor;
    const parts = [];
    if (state.share.ziele) parts.push(`<h3>Ziele von ${firstName()}</h3>${goalsList()}`);
    if (state.share.fuehrung) parts.push(`<h3>So begleitest du ${firstName()}</h3>${sponsorText(S.begleiten)}<h3>Frühwarnzeichen</h3>${sponsorText(S.warnung)}<h3>Passendes Onboarding-Tempo</h3>${sponsorText(S.tempo)}`);
    if (state.share.rahmen) parts.push(`<h3>Rahmen</h3>${rahmenList()}`);
    return `<div class="sponsor-view">
      <div class="eyebrow">Vorschau · Das sieht dein Sponsor</div>
      ${parts.length ? parts.join('') : '<p class="empty">Noch nichts freigegeben. Dein Sponsor sieht im Moment nichts aus deinem Profil.</p>'}
      <p class="muted small" style="margin-top:12px">Typ und Antriebe sind nie Teil der Freigabe.</p>
    </div>`;
  }

  function viewProfile() {
    const r = evaluate();
    initGoals(r);
    const sw = (key, title, desc) => `
      <div class="toggle"><div><strong>${title}</strong><br><span class="muted small">${desc}</span></div>
        <label class="switch"><input type="checkbox" data-share="${key}" ${state.share[key] ? 'checked' : ''} aria-label="${title} freigeben"><span class="slider"></span></label></div>`;
    return `
      <div class="eyebrow">Mein Profil · nur für dich sichtbar</div>
      ${resultBlocks(r)}
      <div class="card"><h3 style="margin-top:0">Meine Ziele</h3>${goalsList()}
        <p class="muted small">Alle 3 Monate erinnert dich die App an deinen Ziel-Check: behalten, anpassen oder neu setzen.</p></div>
      <div class="card"><h3 style="margin-top:0">Mein Rahmen</h3>${rahmenList()}</div>

      <div class="card no-print">
        <h3 style="margin-top:0">Mit meinem Sponsor teilen</h3>
        <p class="muted">Du entscheidest, was dein Sponsor sehen darf. Du kannst es jederzeit wieder ausschalten.</p>
        ${sw('ziele', 'Ziele', 'WARUM, 12-Monats-Ziel, Kunden- und Partnerziel, Wachstumsziel')}
        ${sw('fuehrung', 'Führungshinweise', 'So begleitet dein Sponsor dich, Frühwarnzeichen, passendes Tempo (ohne Typnamen)')}
        ${sw('rahmen', 'Rahmen', 'Zeit, Energie, Kanäle, Lernstil und deine Notiz an den Sponsor')}
      </div>
      <div class="no-print" id="sponsorPreview">${sponsorPreview(r)}</div>

      <div class="card no-print" style="margin-top:18px">
        <h3 style="margin-top:0">Danke fürs Testen!</h3>
        <p>Schick Tanja kurz deine Rückmeldung, gern als Sprachnachricht:</p>
        <ul>
          <li>Waren alle Fragen klar? Bei welcher hast du gezögert?</li>
          <li>Erkennst du dich in deinem Ergebnis wieder?</li>
          <li>Passen die Vorschläge für deine Ziele zu dir?</li>
        </ul>
      </div>

      <div class="card sand no-print">
        <h3 style="margin-top:0">Nächster Schritt: deine Wortstil-Probe</h3>
        <p>Drei kurze Schreibproben, damit die App Nachrichtenentwürfe schreibt, die klingen wie du.</p>
        <button class="btn secondary" data-act="open-wortstil">Wortstil-Probe starten</button>
      </div>

      ${state.confirmRestart ? `
      <div class="card sand no-print" role="alert">
        <strong>Test wirklich neu starten?</strong> Deine Antworten und Ziele werden verworfen.
        <div class="actions" style="margin-top:12px"><button class="btn ghost" data-act="restart-cancel">Abbrechen</button><button class="btn" data-act="restart-yes">Ja, neu starten</button></div>
      </div>` : ''}
      <div class="actions">
        ${backBtn('Ziele ändern')}
        <span style="display:flex;gap:10px;flex-wrap:wrap">
          ${window.KOMPASS_NO_PRINT ? '' : '<button class="btn secondary" data-act="print">Als PDF speichern</button>'}
          <button class="btn ghost" data-act="restart">Test neu starten</button>
        </span>
      </div>`;
  }

  // ---------- Rendern ----------
  function render() {
    const list = screens();
    const s = list[state.step];
    progressBar.style.width = state.flow ? `${(state.step / (list.length - 1)) * 100}%` : '0%';
    brandSub.textContent = state.flow === 'wortstil' ? '· Wortstil-Probe' : '· Der Freiheits-Kompass';
    app.innerHTML =
      !state.flow ? viewHome() :
      s.kind === 'ws-start' ? viewWsStart() :
      s.kind === 'ws-sample' ? viewWsSample(s) :
      s.kind === 'ws-voice' ? viewWsVoice() :
      s.kind === 'ws-profile' ? viewWsProfile() :
      s.kind === 'ws-draft' ? viewWsDraft() :
      s.kind === 'ws-done' ? viewWsDone() :
      s.kind === 'start' ? viewStart() :
      s.kind === 'intro' ? viewIntro(s) :
      s.kind === 'choice' ? viewChoice(s) :
      s.kind === 'rahmen' ? viewRahmen(s) :
      s.kind === 'result' ? viewResult() :
      s.kind === 'goal' ? viewGoal(s) :
      viewProfile();
  }

  // ---------- Ereignisse ----------
  app.addEventListener('click', (e) => {
    const t = e.target.closest('button');
    if (!t) return;
    const s = screens()[state.step];

    if (t.dataset.act === 'home') { state.flow = null; return go(0); }
    if (t.dataset.act === 'open-kompass') return openFlow('kompass');
    if (t.dataset.act === 'open-wortstil') return openFlow('wortstil');
    if (t.dataset.act === 'ws-analyse') {
      // Proben unverändert und Steckbrief schon da? Dann nicht neu auswerten.
      const key = [state.ws.s1, state.ws.s2, state.ws.s3, state.ws.voice].join('|');
      next();
      if (state.ws.profile && state.ws.status === 'done' && state.ws.key === key) return;
      state.ws.key = key;
      return runAnalysis(false);
    }
    if (t.dataset.act === 'ws-analyse-again') return runAnalysis(true);
    if (t.dataset.act === 'ws-draft') { next(); if (!state.ws.draft) runDraft(); return; }
    if (t.dataset.act === 'ws-draft-again') return runDraft();
    if (t.dataset.act === 'ws-skip-draft') return next();
    if (t.dataset.verdict) { state.ws.verdict = t.dataset.verdict; render(); app.querySelector('#wsFeedback')?.focus(); return; }
    if (t.dataset.act === 'next') return next();
    if (t.dataset.act === 'back') return back();
    if (t.dataset.act === 'print') return window.print();
    if (t.dataset.act === 'restart') { state.confirmRestart = true; return render(); }
    if (t.dataset.act === 'restart-cancel') { state.confirmRestart = false; return render(); }
    if (t.dataset.act === 'restart-yes') {
      Object.assign(state, { a: {}, b: {}, c: { channels: [] }, d: null, share: { ziele: false, fuehrung: false, rahmen: false }, order: {}, confirmRestart: false });
      return go(1);
    }
    if (t.dataset.pick) {
      state[s.part][s.q.id] = t.dataset.pick;
      render();
      setTimeout(() => { if (screens()[state.step] === s) next(); }, 280);
      return;
    }
    if (t.dataset.rahmen) {
      const q = s.q;
      if (q.multi) {
        const list = state.c[q.key];
        const i = list.indexOf(t.dataset.rahmen);
        i >= 0 ? list.splice(i, 1) : list.push(t.dataset.rahmen);
        render();
      } else {
        state.c[q.key] = t.dataset.rahmen;
        if (q.key === 'hours') state.d = null; // Stunden geändert → Zielvorschlag neu berechnen
        render();
        setTimeout(() => { if (screens()[state.step] === s) next(); }, 280);
      }
      return;
    }
    if (t.dataset.wachstum) {
      const r = evaluate();
      const own = t.dataset.wachstum === 'own';
      state.d.wachstumOwn = own;
      if (!own) state.d.wachstum = D4_SUGGEST[r.main];
      else if (state.d.wachstum === D4_SUGGEST[r.main]) state.d.wachstum = '';
      render();
      if (own) app.querySelector('#wachstum')?.focus();
    }
  });

  app.addEventListener('input', (e) => {
    const t = e.target;
    if (t.id === 'name') state.name = t.value;
    if (t.id === 'free') state.c.note = t.value;
    if (t.dataset.ws) {
      state.ws[t.dataset.ws] = t.value;
      const btn = document.getElementById('wsNext');
      if (btn) btn.disabled = !t.value.trim();
    }
    if (t.dataset.wsfield) {
      state.ws.profile[t.dataset.wsfield] = t.value;
      state.ws.draft = ''; state.ws.verdict = null; // geänderter Steckbrief → neue Beispielnachricht
    }
    if (t.hasAttribute('data-wsfeedback')) state.ws.feedback = t.value;
    if (t.hasAttribute('data-wscode')) {
      state.ws.code = t.value;
      const btn = document.getElementById('wsStartBtn');
      if (btn) btn.disabled = !wsStartReady();
    }
    if (t.dataset.goal) {
      state.d[t.dataset.goal] = t.type === 'number' ? Math.max(0, parseInt(t.value || '0', 10)) : t.value;
    }
  });

  app.addEventListener('change', (e) => {
    const t = e.target;
    if (t.id === 'wsConsent') {
      state.ws.consent = t.checked;
      document.getElementById('wsStartBtn').disabled = !wsStartReady();
    }
    if (t.id === 'consent') {
      state.consent = t.checked;
      document.getElementById('startBtn').disabled = !t.checked;
    }
    if (t.dataset.share) {
      state.share[t.dataset.share] = t.checked;
      document.getElementById('sponsorPreview').innerHTML = sponsorPreview(evaluate());
    }
  });

  render();
})();

</script>
</body>
</html>
